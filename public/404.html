<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Page not found | Mehdi Aichouch</title>

    <style>
      @font-face { font-family: "Geist"; font-weight: 400; font-display: swap; src: url("/fonts/geist-sans-400.woff2") format("woff2"); }
      @font-face { font-family: "Geist"; font-weight: 600; font-display: swap; src: url("/fonts/geist-sans-600.woff2") format("woff2"); }
      @font-face { font-family: "Geist Mono"; font-weight: 400; font-display: swap; src: url("/fonts/geist-mono-400.woff2") format("woff2"); }
      * { box-sizing: border-box; }
      html { background: #0a0a0b; color: #ededee; font-family: "Geist", system-ui, sans-serif; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 2rem; }
      main { max-width: 34rem; }
      .eyebrow { margin: 0; font-family: "Geist Mono", ui-monospace, monospace; font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9aa3; }
      h1 { margin: 1.5rem 0 0; font-size: clamp(2.4rem, 8vw, 4rem); font-weight: 600; line-height: 1; letter-spacing: -0.05em; }
      p { color: #9a9aa3; font-size: 1.1rem; line-height: 1.6; }
      .links { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: 0.75rem; }
      a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1.25rem; border-radius: 999px; border: 1px solid #2a2a30; color: #ededee; font-weight: 600; text-decoration: none; }
      a:first-child { background: #4cc9ff; border-color: #4cc9ff; color: #0a0a0b; }
      a:focus-visible { outline: 2px solid #4cc9ff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Mehdi Aichouch · 404</p>

      <p lang="fr">Cette adresse n'existe pas. Le portfolio tient sur une seule page, en anglais et en français.</p>
      <div class="links">

        <a href="/fr" lang="fr">Version française</a>
      </div>
    </main>
  </body>
