<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#14122b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>

  <!-- Glow -->
  <circle cx="600" cy="315" r="350" fill="#8b5cf6" opacity="0.03"/>

  <!-- Terminal window -->
  <rect x="120" y="100" width="960" height="430" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="120" y="100" width="960" height="44" rx="12" fill="#0f172a"/>
  <rect x="120" y="132" width="960" height="12" fill="#0f172a"/>
  <circle cx="158" cy="122" r="7" fill="#ef4444" opacity="0.7"/>
  <circle cx="182" cy="122" r="7" fill="#f59e0b" opacity="0.7"/>
  <circle cx="206" cy="122" r="7" fill="#22c55e" opacity="0.7"/>
  <text x="600" y="127" font-family="system-ui,monospace" font-size="12" fill="#64748b" text-anchor="middle">python run.py --report</text>

  <!-- Pipeline -->
  <text x="160" y="182" font-family="system-ui,monospace" font-size="13" fill="#64748b">scrape → filter → match → verify contact → draft → digest</text>

