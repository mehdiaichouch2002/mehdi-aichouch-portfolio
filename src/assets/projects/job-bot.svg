  <text x="235" y="241" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#22c55e" text-anchor="middle">Bon match</text>
  <text x="310" y="234" font-family="system-ui,sans-serif" font-size="14" fill="#e2e8f0">Magento 2 Developer · Remote EU</text>
  <text x="310" y="255" font-family="system-ui,monospace" font-size="11" fill="#64748b">required 5/6 covered · MX verified · emailed with CV</text>
  <text x="1015" y="245" font-family="system-ui,monospace" font-size="16" font-weight="700" fill="#22c55e" text-anchor="end">88%</text>

  <rect x="160" y="281" width="880" height="64" rx="8" fill="#0f172a"/>
  <rect x="180" y="298" width="110" height="28" rx="14" fill="#f59e0b" opacity="0.14"/>
  <text x="235" y="317" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle">Contact réseau</text>
  <text x="310" y="310" font-family="system-ui,sans-serif" font-size="14" fill="#e2e8f0">Développeur PHP Symfony · Paris</text>
  <text x="310" y="331" font-family="system-ui,monospace" font-size="11" fill="#64748b">gap: Symfony (transferable from Laravel) · packet ready</text>
  <text x="1015" y="321" font-family="system-ui,monospace" font-size="16" font-weight="700" fill="#f59e0b" text-anchor="end">62%</text>

  <rect x="160" y="357" width="880" height="64" rx="8" fill="#0f172a"/>
  <rect x="180" y="374" width="110" height="28" rx="14" fill="#ef4444" opacity="0.14"/>
  <text x="235" y="393" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#ef4444" text-anchor="middle">À éviter</text>
  <text x="310" y="386" font-family="system-ui,sans-serif" font-size="14" fill="#e2e8f0">Senior Platform Engineer · US only</text>
  <text x="310" y="407" font-family="system-ui,monospace" font-size="11" fill="#64748b">blockers: Kubernetes, location</text>
  <text x="1015" y="397" font-family="system-ui,monospace" font-size="16" font-weight="700" fill="#ef4444" text-anchor="end">21%</text>

  <!-- Footer line -->
  <text x="160" y="465" font-family="system-ui,monospace" font-size="12" fill="#94a3b8">7 sources · 42 ads scanned · 3 emailed · 5 packets · digest sent</text>
  <rect x="790" y="450" width="250" height="28" rx="14" fill="#8b5cf6" opacity="0.12"/>
  <text x="915" y="469" font-family="system-ui,monospace" font-size="11" fill="#a78bfa" text-anchor="middle">⏱ GitHub Actions schedule</text>

  <!-- Bottom title area -->
  <text x="600" y="575" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">Job Application Bot</text>
  <text x="600" y="600" font-family="system-ui,sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Scraping · Honest Matching · LLM Drafting · Python + SQLite</text>
</svg>
